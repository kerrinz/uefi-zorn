# RAM-boot menu. DarwinBoot loads Payloads/kernel.macho and the restore
# ramdisk at Payloads/root.img. The kernel registers the userdata OS
# container as md0 before that ramdisk, so rd=md0 is the read-only APFS root.
# The countdown is 5 seconds.
version = 1

[boot]
timeout = 5
fallback_timeout = 5
default = "xnu"

[ui]
title = "Redmi K80"
layout = "portrait"

[[entry]]
id = "xnu"
title = "Boot XNU"
type = "xnu"
path = "Payloads/kernel.macho"
initrd = "Payloads/root.img"
args = "rd=md0 -v serial=3 debug=0x14e"

[[entry]]
id = "mounted"
title = "Return to firmware"
type = "action"
action = "exit"

[[entry]]
id = "reset"
title = "Restart"
type = "action"
action = "reset"

[[entry]]
id = "shutdown"
title = "Power off"
type = "action"
action = "shutdown"
