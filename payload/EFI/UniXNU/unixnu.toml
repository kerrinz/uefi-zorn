# RAM-boot menu. DarwinBoot loads the kernel/ADT/trust cache, without an
# initrd. OS uses readonly md0; original IOKit/APFS publish SystemOS volumes.
# The countdown is 5 seconds.
version = 1

[boot]
timeout = 5
fallback_timeout = 5
default = "xnu"

[ui]
title = "Redmi K80"
layout = "portrait"

[[entry]]
id = "xnu"
title = "Boot XNU"
type = "xnu"
path = "Payloads/kernel.macho"
args = "rd=md0 -v serial=3 debug=0x14e zorn_pmgr=2 zorn_checkpoint=NOHIT zorn_checkpoint_early=1 zorn_log_only=1 zorn_trace_compact=1 zorn_wdt=1 zorn_hash_budget=120 zorn_service_trace=1"

[[entry]]
id = "mounted"
title = "Return to firmware"
type = "action"
action = "exit"

[[entry]]
id = "reset"
title = "Restart"
type = "action"
action = "reset"

[[entry]]
id = "shutdown"
title = "Power off"
type = "action"
action = "shutdown"
